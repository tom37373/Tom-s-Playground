    <div 
        id="coffee" 
        style="animation-play-state: paused;"
        onclick="
            let coffee = document.getElementById('coffee'); 
            if (coffee.style.animationPlayState!='paused') {
                coffee.style.animationPlayState='paused'
            } else {
                coffee.style.animationPlayState='';
            }
        ">
